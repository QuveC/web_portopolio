<style>
:root {
  --raw-color-ice-50:#f7fafb; --raw-color-ice-100:#ebeef1; --raw-color-ice-200:#dfe5e9;
  --raw-color-steel-400:#b6c1c8; --raw-color-ink-950:#090a0b; --raw-color-ink-900:#0e0f14;
  --raw-color-ink-800:#1b1d24; --raw-color-ink-700:#2a2d36; --raw-color-ink-alpha-35:rgb(9 10 11 / .35);
  --raw-color-slate-500:#7a7a7a; --raw-color-slate-600:#4d4d4d; --raw-color-slate-900:#1e1e1e;
  --raw-color-cyan-400:#02d2e3; --raw-color-cyan-alpha-25:rgb(2 210 227 / .25);
  --raw-color-stone-600:#535450; --raw-color-white-alpha-10:rgb(255 255 255 / .1);
  --raw-color-white-alpha-20:rgb(255 255 255 / .2); --raw-color-ink-alpha-08:rgb(9 10 11 / .08);
  --raw-color-white-alpha-40:rgb(255 255 255 / .4); --raw-color-white:#fff; --raw-color-orange-500:#ff6b00;

  --background:var(--raw-color-ice-50); --foreground:var(--raw-color-ink-950);
  --foreground-muted:var(--raw-color-ink-alpha-35); --surface-dark:var(--raw-color-ink-900);
  --surface-dark-raised:var(--raw-color-ink-800); --surface-black:var(--raw-color-ink-950);
  --surface-muted:var(--raw-color-ice-100); --surface-soft:var(--raw-color-ice-200);
  --foreground-on-dark:var(--raw-color-white); --foreground-on-dark-muted:var(--raw-color-steel-400);
  --foreground-on-dark-faint:var(--raw-color-white-alpha-40); --border-muted:var(--raw-color-ice-200);
  --border-on-dark:var(--raw-color-ink-700); --map-dot:var(--raw-color-slate-500);
  --map-grid:var(--raw-color-slate-600); --map-grid-ghost:var(--raw-color-slate-900);
  --map-mark:var(--raw-color-ice-50); --timeline-outline:var(--raw-color-stone-600);
  --timeline-fill:var(--raw-color-white-alpha-10); --timeline-rail:var(--raw-color-white-alpha-20);
  --paddock-contour:var(--raw-color-ink-alpha-08); --footer-contour:var(--raw-color-white-alpha-10);
  --accent:var(--raw-color-cyan-400); --accent-muted:var(--raw-color-cyan-alpha-25);
  --type-impact:6rem; --type-display-lg:4.375rem; --type-display:3.25rem; --type-heading:2.375rem;
  --type-title:1.25rem; --type-lead:1.125rem; --type-label:1rem; --type-body:.875rem;
  --type-eyebrow:.75rem; --type-display-sm:3.4375rem; --type-year:2.25rem;
  --ease-entrance:cubic-bezier(.2,0,0,1); --ease-plate:cubic-bezier(.33,0,0,1);
  --font-sans:"Space Grotesk", system-ui, sans-serif; --font-display:"Oswald", Impact, sans-serif;
}
html { font-size:16px; }
@media (max-width:1920px) { html { font-size:.833333vw; } }
@media (max-width:1440px) { html { font-size:1.111111vw; } }
@media (max-width:1279px) { html { font-size:16px; } }
html.lenis, html.lenis body { height:auto; }
.lenis.lenis-stopped { overflow:hidden; }
html.locked { position:relative; overflow:hidden; height:100%; }
* { box-sizing:border-box; }
body { margin:0; min-height:100lvh; background:var(--background); color:var(--foreground); font-family:var(--font-sans); -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
ul, ol, dl, dd, p, h1, h2 { margin:0; padding:0; list-style:none; }
img { display:block; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.split { display:flex; flex-wrap:wrap; column-gap:.3em; }
.split > span { display:inline-block; }
.split .w { display:inline-flex; white-space:nowrap; }
.split .w > span { display:inline-block; }
.up { text-transform:uppercase; }
.hov { transition:color 150ms var(--ease-entrance); }
.hov:hover { color:var(--accent); }
.display { font-family:var(--font-display); font-weight:700; text-transform:uppercase; line-height:.95; }

/* error banner */
#asset-errors { position:fixed; left:12px; right:12px; bottom:12px; z-index:100; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
#asset-errors div { background:var(--raw-color-orange-500); color:#fff; font:500 13px/1.3 var(--font-sans); padding:8px 12px; pointer-events:auto; }

/* ---------- loading veil ---------- */
#veil { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--background); pointer-events:auto; }
.veil-inner { display:flex; flex-direction:column; align-items:center; }
.veil-mark { position:relative; width:7.2rem; height:8.5rem; display:flex; align-items:center; justify-content:center; }
.veil-mark svg { width:100%; height:100%; overflow:visible; }
.veil-name { margin-top:1.75rem; font-size:var(--type-lead); text-transform:uppercase; line-height:.9; letter-spacing:.18em; }
.veil-meter { position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--border-muted); }
.veil-meter i { position:absolute; inset:0; background:var(--foreground); transform-origin:left; transform:scaleX(0); }

/* ---------- the stack ---------- */
.stack { position:relative; background:var(--surface-black); }
.layer { position:sticky; top:0; }
.layer:nth-child(1) { z-index:0; } .layer:nth-child(2) { z-index:10; }
.layer.last { position:relative; z-index:20; }
.layer-inner { transform-origin:center; }
.shade { position:absolute; inset:0; background:var(--surface-black); opacity:0; pointer-events:none; }

/* ---------- hero ---------- */
[data-hero] { position:relative; isolation:isolate; min-height:100lvh; overflow:hidden; background:var(--background); }
@media (min-width:1441px) and (max-width:1920px) {
  [data-hero] { --hb:calc(1920 / 1440); --type-impact:calc(6rem * var(--hb)); --type-display-lg:calc(4.375rem * var(--hb));
    --type-display:calc(3.25rem * var(--hb)); --type-heading:calc(2.375rem * var(--hb)); --type-title:calc(1.25rem * var(--hb));
    --type-lead:calc(1.125rem * var(--hb)); --type-label:calc(1rem * var(--hb)); --type-body:calc(.875rem * var(--hb)); --type-eyebrow:calc(.75rem * var(--hb)); }
  [data-hero] [data-hero-panels] { width:calc(13.625rem * var(--hb)); }
  [data-season] { --sb:calc(1920 / 1440); --type-display-sm:calc(3.4375rem * var(--sb)); --type-lead:calc(1.125rem * var(--sb));
    --type-body:calc(.875rem * var(--sb)); --type-eyebrow:calc(.75rem * var(--sb)); }
}
.hero-canvas { position:absolute; inset:0; z-index:0; width:100%; height:100%; display:block; pointer-events:none; transform:translateZ(0); backface-visibility:hidden; }
.hero-fit { position:absolute; left:0; right:0; bottom:0; height:60%; pointer-events:none; }
@media (max-width:639px) { .hero-fit { height:52%; } }
@media (min-width:1280px) { .hero-fit { display:none; } }
.hero-ramp { position:absolute; left:0; right:0; bottom:0; height:22%; z-index:10; pointer-events:none;
  background-image:linear-gradient(to bottom, color-mix(in srgb, var(--background) 0%, transparent) 0%, color-mix(in srgb, var(--background) 6%, transparent) 26%,
  color-mix(in srgb, var(--background) 20%, transparent) 46%, color-mix(in srgb, var(--background) 45%, transparent) 64%,
  color-mix(in srgb, var(--background) 74%, transparent) 80%, color-mix(in srgb, var(--background) 93%, transparent) 91%, var(--background) 100%); }
@media (min-width:1280px) { .hero-ramp { display:none; } }
.hero-content { position:relative; z-index:20; min-height:100lvh; display:flex; flex-direction:column; gap:1.5rem; padding:1.5rem; }
@media (min-width:640px) { .hero-content { padding:1.5rem 2rem; gap:2rem; } }
@media (max-height:500px) { .hero-content { padding-block:.75rem; gap:1rem; } }
.masthead { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:30; }
.logo { display:flex; align-items:center; gap:.5rem; height:1.5rem; font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.25rem; line-height:1; letter-spacing:-.01em; }
.logo b { display:inline-grid; place-items:center; height:1.5rem; padding:0 .35rem; background:var(--foreground); color:var(--background); font-size:.95rem; }
.logo em { font-style:normal; color:var(--accent); }
.nav-primary { position:absolute; left:50%; transform:translateX(-50%); display:none; }
.nav-primary ul { display:flex; gap:4rem; }
.nav-primary a, .garage { font-size:var(--type-label); text-transform:uppercase; line-height:.9; }
.garage { font-weight:700; display:none; }
@media (min-width:1280px) { .nav-primary, .garage { display:block; } .burger { display:none !important; } }
.burger { padding:.5rem; margin-right:-.5rem; background:none; border:0; cursor:pointer; display:flex; flex-direction:column; gap:.3125rem; }
.burger i { display:block; width:1.5rem; height:1px; background:var(--foreground); }
.hero-mid { display:flex; flex-direction:column; gap:1.5rem; }
@media (min-width:768px) { .hero-mid { flex-direction:row; justify-content:space-between; align-items:flex-start; gap:2rem; } }
@media (min-width:1280px) { .hero-mid { flex:1; align-items:center; } }
.identity { position:relative; display:flex; flex-direction:column; gap:1.5rem; max-width:26.0625rem; }
@media (min-width:1280px) { .identity { gap:6.0625rem; } }
.handle { font-size:var(--type-label); text-transform:uppercase; color:var(--foreground-muted); margin-bottom:1rem; display:block; }
@media (min-width:1280px) { .handle { position:absolute; left:20.0625rem; top:.5625rem; margin:0; } }
.name { font-family:var(--font-display); font-weight:700; text-transform:uppercase; line-height:.95; font-size:var(--type-display-lg); max-width:6em; }
.name .split { justify-content:flex-start; text-align:left; }
@media (min-width:768px) { .name { font-size:var(--type-impact); } }
@media (min-width:1024px) and (max-width:1279px) { .name { font-size:var(--type-display-lg); } }
@media (min-width:1280px) { .name { font-size:var(--type-impact); } }
@media (max-height:500px) { .name { font-size:var(--type-heading); } }
.meta { display:flex; flex-direction:column; gap:1rem; }
@media (max-height:500px) { .meta { gap:.25rem; } }
.meta li { display:flex; align-items:center; gap:.5rem; font-size:var(--type-lead); text-transform:uppercase; line-height:.9; }
.meta svg { flex:none; }
.panels { display:none; flex-direction:column; gap:2rem; }
@media (min-width:640px) { .panels { display:flex; flex-direction:row; flex-wrap:wrap; } }
@media (min-width:768px) { .panels { flex-direction:column; width:13.625rem; } }
.bpanel { position:relative; padding:1rem; color:var(--foreground); }
@media (min-width:640px) { .bpanel { padding:1rem 1.375rem 1.1875rem; } }
.corner { position:absolute; width:.625rem; height:.625rem; overflow:visible; }
.corner path { fill:none; stroke:currentColor; }
.corner.tr { top:0; right:0; } .corner.tl { top:0; left:0; transform:scaleX(-1); }
.corner.bl { bottom:0; left:0; transform:scale(-1); } .corner.br { bottom:0; right:0; transform:scaleY(-1); }
.eyebrow { font-size:var(--type-eyebrow); font-weight:500; text-transform:uppercase; line-height:.9; letter-spacing:-.02em; color:var(--accent); }
.now-list { margin-top:1rem; display:flex; flex-direction:column; gap:.375rem; font-size:var(--type-body); text-transform:uppercase; line-height:.9; }
.now-list dt { font-weight:700; }
.now-mark { margin-top:1.75rem; width:4.875rem; height:3.125rem; }
.stats { margin-top:1.5rem; display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
.stats > div { display:flex; flex-direction:column; align-items:center; gap:.5rem; }
.stats dt { font-size:var(--type-eyebrow); text-transform:uppercase; letter-spacing:-.04em; white-space:nowrap; }
.stats dd { font-family:var(--font-display); font-weight:500; font-size:var(--type-heading); line-height:.72; letter-spacing:-.08em; }
.actions { display:flex; flex-direction:column; gap:1rem; margin-top:auto; }
@media (min-width:640px) { .actions { display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:2rem; } }
.trailer { display:none; align-items:center; gap:.75rem; }
@media (min-width:640px) { .trailer { display:flex; } }
.trailer span { display:flex; flex-direction:column; gap:.375rem; font-size:var(--type-body); text-transform:uppercase; line-height:.9; }
.trailer b { font-weight:500; } .trailer small { font-size:inherit; color:var(--foreground-muted); }
.trailer:hover b { color:var(--accent); }
.socials { display:none; justify-content:flex-end; gap:2rem; font-size:var(--type-body); text-transform:uppercase; }
@media (min-width:640px) { .socials { display:flex; } }
@media (min-width:1280px) { .socials { gap:3.6875rem; } }

/* chamfered buttons */
.cta { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:1.6em; color:var(--accent); text-transform:uppercase; line-height:.9; }
.cta-frame { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.cta-flood { fill:var(--accent); transform-box:fill-box; transform-origin:left; transform:scaleX(0); transition:transform 250ms var(--ease-plate); }
.cta:hover .cta-flood { transform:scaleX(1); }
.cta-label { position:relative; display:inline-flex; align-items:center; gap:1.6em; transition:color 250ms; }
.cta:hover .cta-label { color:var(--surface-black); }
.cta-arrow { width:.65em; height:.5em; overflow:visible; transition:transform 150ms var(--ease-entrance); }
.cta-arrow path { stroke:currentColor; fill:none; }
.cta:hover .cta-arrow { transform:translateX(.25rem); }
.cta--hero { font-size:var(--type-title); width:100%; height:3.5rem; }
@media (min-width:640px) { .cta--hero { width:11em; height:2.5em; } }
.cta-body { fill:var(--surface-dark); }
.cta-ring { fill:none; stroke:var(--accent); stroke-opacity:.25; }
.cta-brackets { fill:none; stroke:var(--accent); }
.cta--slab { --h:var(--cta-h, calc(var(--u) * 50)); height:var(--h); width:calc(var(--h) * 4.34); justify-content:flex-start; font-size:calc(var(--h) * 20 / 50); }
.cta--slab .cta-label, .cta--hollow .cta-label { position:absolute; top:0; bottom:0; left:calc(var(--h) * 24 / 50); gap:calc(var(--h) * 32 / 50); }
.cta--slab .cta-arrow, .cta--hollow .cta-arrow { width:calc(var(--h) * 13.71 / 50); height:calc(var(--h) * 10.71 / 50); }
.cta--slab .cta-outline { fill:var(--surface-black); stroke:var(--accent); vector-effect:non-scaling-stroke; }
.cta--hollow { --h:var(--cta-h, calc(var(--u) * 50)); height:var(--h); width:calc(var(--h) * 5.5); font-size:calc(var(--h) * 20 / 50); }
.cta--hollow .cta-outline { fill:none; stroke:var(--accent); vector-effect:non-scaling-stroke; }

/* menu sheet */
.sheet { position:fixed; inset:0; z-index:50; background:var(--background); padding:1.5rem 2rem; display:flex; flex-direction:column; opacity:0; }
.sheet-top { display:flex; align-items:center; justify-content:space-between; }
.sheet-close { position:relative; width:2.5rem; height:2.5rem; margin-right:-.5rem; background:none; border:0; cursor:pointer; }
.sheet-close i { position:absolute; left:.5rem; top:50%; width:1.5rem; height:1px; background:var(--foreground); }
.sheet-close i:first-child { transform:rotate(45deg); } .sheet-close i:last-child { transform:rotate(-45deg); }
.sheet nav { flex:1; display:flex; flex-direction:column; justify-content:center; }
.sheet ul { display:flex; flex-direction:column; gap:1rem; }
.sheet ul a { font-family:var(--font-display); font-weight:700; text-transform:uppercase; line-height:.95; font-size:var(--type-heading); display:inline-block; }
@media (min-width:640px) { .sheet ul { gap:1.5rem; } .sheet ul a { font-size:var(--type-display); } }

/* chequered dissolve */
.checker { position:absolute; left:0; right:0; top:0; height:34svh; pointer-events:none; z-index:10; display:block; width:100%; }
.checker.top30 { z-index:30; }
@media (max-width:639px) { .checker, .checker.top30 { z-index:0; } }

/* ---------- season / the year so far ---------- */
[data-season] { container-type:inline-size; position:relative; isolation:isolate; min-height:var(--season-h, 100lvh); overflow:hidden; background:var(--surface-black); color:var(--foreground-on-dark); }
@media (max-width:1023px) { [data-season] { --gutter-min:32px; --type-min:13px; --copy-min-size:17px; --copy-min-w:15rem; --head-min:6.6667cqw;
  --plate-w:277px; --plate-h:78px; --plate-cell:83px; --plate-badge-gap:11px; --plate-stats-left:16px; --plate-stats-gap:8px; --plate-eyebrow:12px; --plate-body:14px; } }
@media (max-width:639px) { [data-season] { --head-min:40px; --head-air:20px; --season-h:680px; } }
.stage-frame { position:absolute; inset:0; overflow:hidden; -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 10%, #000 90%, transparent 100%); mask-image:linear-gradient(to bottom, transparent 0, #000 10%, #000 90%, transparent 100%); }
@media (max-width:1023px) { .stage-frame { -webkit-mask-image:none; mask-image:none; } }
.stage { position:absolute; left:0; top:0; width:1440px; height:800px; transform-origin:top left; }
.map-box { position:absolute; left:0; top:-4.559px; width:1438.43px; height:809.11px; }
.map-box canvas, .map-box svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.trace { position:absolute; left:0; top:0; width:1440px; height:800px; }
.season-copy { position:relative; z-index:20; min-height:var(--season-h, 100lvh); display:flex; flex-direction:column; justify-content:space-between; gap:4rem; padding:4.8611cqw 1.5rem 2rem; pointer-events:none; }
@media (min-width:640px) { .season-copy { --g:max(2.2222cqw, var(--gutter-min, 0px)); padding:4.8611cqw var(--g) var(--g); } }
.season-head { font-family:var(--font-display); font-weight:700; text-transform:uppercase; line-height:.95; color:var(--accent); font-size:max(3.8194cqw, var(--head-min, 0px)); }
.head-line { display:flex; align-items:baseline; }
.head-line .split { justify-content:flex-start; }
.stop { color:var(--foreground-on-dark); display:inline-block; }
.rule { width:1.6667cqw; height:.1389cqw; min-height:2px; background:var(--accent); margin-top:max(1.9444cqw, var(--head-air, 0px)); transform-origin:left; }
.season-intro { margin-top:max(2.0833cqw, var(--head-air, 0px)); width:max(16.1111cqw, var(--copy-min-w, 0px)); font-size:max(1.25cqw, var(--copy-min-size, 0px)); text-transform:uppercase; line-height:1.1; }
.splate { align-self:flex-end; position:relative; width:var(--plate-w, 19.2361cqw); height:var(--plate-h, 5.4167cqw); display:grid; grid-template-columns:var(--plate-cell, 5.7639cqw) 1fr; }
.splate > svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.splate-badge { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--plate-badge-gap, .7639cqw); }
.splate-badge svg { width:var(--plate-globe-w, 2.5694cqw); height:var(--plate-globe-h, 1.5972cqw); overflow:visible; }
.splate-badge svg * { fill:none; stroke:var(--accent); stroke-width:1; vector-effect:non-scaling-stroke; }
.badge-type { display:flex; gap:.3em; font-size:var(--plate-eyebrow, max(.8333cqw, var(--type-min, 0px))); line-height:.72; letter-spacing:-.02em; text-transform:uppercase; }
.badge-type .a { color:var(--accent); }
.splate-stats { position:relative; display:flex; flex-direction:column; justify-content:center; padding-left:var(--plate-stats-left, 1.1111cqw); gap:var(--plate-stats-gap, .5556cqw); text-transform:uppercase; line-height:.72; font-size:var(--plate-body, max(.9722cqw, var(--type-min, 0px))); }
.splate-stats > div { display:flex; gap:.35em; }
.splate-stats dt { color:var(--accent); } .splate-stats dd { flex:1; white-space:nowrap; }

/* ---------- timeline / journey ---------- */
[data-timeline] { container-type:inline-size; position:relative; isolation:isolate; width:100%; background:var(--surface-black); color:var(--foreground-on-dark);
  --u:calc(100cqw / 1440); --gutter:max(2.2222cqw, var(--gutter-min, 0px)); padding-bottom:10.4167cqw; }
@media (max-width:1023px) { [data-timeline] { overflow-x:clip; --copy-min-size:17px; --head-min:6.6667cqw; --head-w-min:82cqw; --year-min:30px; --copy-min-w:200px; } }
@media (min-width:640px) and (max-width:1023px) { [data-timeline] { --top-pad-extra:16cqw; --head-top:10.4167cqw; } }
@media (max-width:639px) { [data-timeline] { --head-min:40px; --top-pad-extra:15cqw; --copy-min-w:320px; --gutter-min:24px; } }

/** react-spring's damped spring: 1ms substeps, 64ms frame cap, mass 1. */
class Spring {
  constructor(value, cfg, onUpdate) { Object.assign(this, { value, velocity: 0, target: value, cfg, onUpdate, unsub: null, startAt: 0, last: 0, t0: 0, from: value }); }
  to(target, delay = 0) {
    this.target = target;
    if (delay > 0 || !this.unsub) this.startAt = performance.now() + delay;
    if (!this.unsub) { this.last = 0; this.unsub = subscribe((t) => this.tick(t)); }
    return this;
  }
  jump(v) { this.value = this.target = v; this.velocity = 0; this.onUpdate(v); }
  tick(t) {
    if (t < this.startAt) return;
    if (!this.last) { this.last = t; this.t0 = t; this.from = this.value; return; }
    const dt = Math.min(64, t - this.last); this.last = t;
    const c = this.cfg;
    if (REDUCED) { this.value = this.target; this.velocity = 0; }
    else if (c.duration != null) {

      this.value = this.from + (this.target - this.from) * (c.easing ? c.easing(u) : u);
      this.velocity = u >= 1 ? 0 : 1;
    } else {
      for (let i = 0; i < dt; i++) {
        const a = -c.tension * 1e-6 * (this.value - this.target) - c.friction * 1e-3 * this.velocity;
        this.velocity += a; this.value += this.velocity;
      }
    }
    const rest = Math.abs(this.velocity) < 1e-4 && Math.abs(this.target - this.value) < 5e-4;
    if (rest) { this.value = this.target; this.velocity = 0; }
    this.onUpdate(this.value);
    if (rest && this.unsub) { this.unsub(); this.unsub = null; }

      const rc = 54, i0 = Math.floor((pointer.x - rc - L.originX) / L.pitchX), i1 = Math.ceil((pointer.x + rc - L.originX) / L.pitchX);
      const j0 = Math.floor((pointer.y - rc - L.originY) / L.pitchY), j1 = Math.ceil((pointer.y + rc - L.originY) / L.pitchY);
      for (let j = Math.max(0, j0); j <= Math.min(H - 1, j1); j++) for (let i = Math.max(0, i0); i <= Math.min(W - 1, i1); i++) {
        const k = cell[j * W + i]; if (k < 0) continue; add(k, falloff(Math.hypot(xs[k * 2] - pointer.x, xs[k * 2 + 1] - pointer.y) / rc) * pointer.heat);
      }
    };
    const draw = () => {
      if (!canvas.width) return;
      const s = canvas.width / 2560; ctx.setTransform(s, 0, 0, s, 0, 0); ctx.clearRect(0, 0, 2560, 1440); ctx.drawImage(baked, 0, 0, 2560, 1440);
      const th = 0.34, span = 1 - th, box = R * 2 + 1; let drew = 0;
      for (let k = 0; k < activeCount; k++) { const i = active[k]; if (level[i] < th) continue; ctx.clearRect(xs[i * 2] - R - 0.5, xs[i * 2 + 1] - R - 0.5, box, box); drew++; }
      if (!drew) return;
      for (let k = 0; k < activeCount; k++) {
        const i = active[k], v = level[i]; if (v < th || (cols[i] + rws[i]) & 1) continue;
        const t = Math.min(1, (v - th) / span), side = L.pitchX * (0.7 + 0.3 * t);
        ctx.fillStyle = rgba(v > 0.8 ? PALETTE.white : v > 0.5 ? PALETTE.bright : mixc(PALETTE.accent, PALETTE.bright, v));
        ctx.fillRect(xs[i * 2] - side / 2, xs[i * 2 + 1] - side / 2, side, side);
      }
    };
    const approach = (a, b, dt, tau) => b + (a - b) * Math.exp(-dt / tau);
    let last = 0;
    const frame = () => {
      const now = performance.now(), dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
      const wanted = target.on && armed ? 0.95 : 0;
      if (pointer.heat <= 0.001 && wanted > 0) { pointer.x = target.x; pointer.y = target.y; }
      else if (dt > 0) {
        const px0 = pointer.x, py0 = pointer.y;
        pointer.x = approach(px0, target.x, dt, 0.07); pointer.y = approach(py0, target.y, dt, 0.07);
        const speed = Math.hypot(pointer.x - px0, pointer.y - py0) / dt, want = Math.max(0, 1 - speed / 900);
        spread = approach(spread, want, dt, want > spread ? 0.38 : 0.09);
      }
      pointer.heat = approach(pointer.heat, wanted, dt || 0.016, wanted > pointer.heat ? 0.14 : 0.3);
      if (pointer.heat < 0.005) { pointer.heat = 0; spread = 0; }
      const decay = Math.exp(-dt / 0.3); let write = 0;
      for (let k = 0; k < activeCount; k++) { const i = active[k], v = level[i] * decay; if (v > 0.02) { level[i] = v; active[write++] = i; } else { level[i] = 0; inList[i] = 0; } }
      const before = activeCount; activeCount = write;
      lightUp();
      if (activeCount === 0 && before === 0 && !dirty) return;
      dirty = false; draw();
    };
    new ResizeObserver(bake).observe(canvas);
    const canPoint = !matchMedia("(hover: none)").matches && !REDUCED;
    if (canPoint) {
      addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse") return;
        const sr = season.getBoundingClientRect(), on = e.clientX >= sr.left && e.clientX <= sr.right && e.clientY >= sr.top && e.clientY <= sr.bottom;
        target.on = on; if (!on) return;
        const r = canvas.getBoundingClientRect(); target.x = ((e.clientX - r.left) / r.width) * 2560; target.y = ((e.clientY - r.top) / r.height) * 1440;
      }, { passive: true });
      document.addEventListener("pointerleave", () => (target.on = false)); addEventListener("blur", () => (target.on = false));
    }
    subscribe(() => { if (live.live()) frame(); });
    return { arm: () => (armed = true) };
  })();
})();

/* =====================================================================
   4 · Journey (the timeline)
   ===================================================================== */
const timeline = $("[data-timeline]");
(() => {
  const E = CONFIG.journey.entries, H = { centre: 462, side: 217 }, PW = { centre: 710, side: 333 }, PAR = { plate: { side: 60, centre: 20 }, copy: 110 };
  const railH = 169 + E.reduce((t, e) => t + H[e.frame], 0);
  const lastTop = 169 + E.slice(0, -1).reduce((t, e) => t + H[e.frame], 0);
  const rest = lastTop + H[E[E.length - 1].frame] / 2 - 50;
  timeline.innerHTML = `
    <div class="tl-wrap">
      <div class="rail" aria-hidden="true"><svg viewBox="0 0 16 ${railH}">
        <line x1="8" y1="0" x2="8" y2="98" stroke="var(--timeline-rail)"/>
        <line x1="8" y1="102" x2="8" y2="${rest}" stroke="var(--timeline-rail)" stroke-dasharray="6 6"/>
        <rect class="run" x="7.5" y="0" width="1" height="0" fill="var(--foreground-on-dark)"/>
        <rect class="mark" x="-4.5" y="-4.5" width="9" height="9" fill="var(--foreground-on-dark)"/>
      </svg></div>
      <h2 class="tl-head"><span class="head-line"><span class="hl">${CONFIG.journey.title[0]}</span></span><span class="head-line"><span class="hl">${CONFIG.journey.title[1]}</span><span class="stop" aria-hidden="true">.</span></span></h2>
      ${E.map((e, i) => `
        <div class="tl-row ${e.frame} ${e.align || ""} ${i % 2 ? "even" : "odd"}">
          <div class="tl-layer lp">
            <${e.href ? `a href="${e.href}" target="_blank" rel="noopener" aria-label="${e.title}"` : "div"} class="tl-plate" style="display:block">
              <div class="plate-fill" style="clip-path:url(#plate-clip)"><div class="plate-slot">
                ${e.img ? `<img src="${e.img}" alt="" loading="lazy" crossorigin="anonymous">` : `<div class="plate-art"><b>${e.title}</b><small>${e.tag}</small></div>`}
              </div></div>
              ${plateOutline}
            </${e.href ? "a" : "div"}>
            <div class="tl-year">${e.year}</div>
          </div>
          ${e.frame === "centre" && e.copy ? `<div class="tl-layer lc"><p class="tl-copy" style="--cw:${e.cw || 260}"><b>${e.lead}</b> ${e.copy}</p></div>` : ""}
        </div>`).join("")}
    </div>`;
  checker(timeline, "light", "top30");
  const heads = $$(".hl", timeline).map((el) => split(el, { stagger: 110 }));
  const stop = rise($(".tl-head .stop", timeline), { y: null, delay: 240 });
  onceInView($(".tl-head", timeline), () => { heads.forEach((h, i) => h.play(i * 130)); stop.play(); });

  const narrow = () => innerWidth < 640;
  $$(".tl-row", timeline).forEach((row, i) => {
    const e = E[i];
    const lp = $(".lp", row), lc = $(".lc", row), slot = $(".plate-slot", row), year = $(".tl-year", row), plate = $(".tl-plate", row);
    const tp = PAR.plate[e.frame];
    addScrub(row, "top_bottom", "bottom_top", (p) => {
      lp.style.top = narrow() ? "" : `calc(var(--u) * ${tp * (1 - 2 * p)})`;
      if (lc) lc.style.top = narrow() ? "" : `calc(var(--u) * ${PAR.copy * (1 - 2 * p)})`;
    });
    addScrub(row, "top_bottom", "top_center", (p) => (slot.style.top = `${-10 + 10 * p}%`));
    const letters = split(year, { mode: "letters", stagger: 26, cfg: CFG.YEAR });
    const copy = lc ? rise($(".tl-copy", lc), { cfg: CFG.COPY, delay: 220 }) : null;
    onceInView(row, () => {
      letters.play(0); copy?.play();
      if (e.frame === "centre") setTimeout(() => new Spring(1, CFG.SETTLE, (v) => (year.style.opacity = v)).to(0.4), 2200 + 26 * e.year.length);
    }, "0% 0% -25% 0%");
    if (matchMedia("(hover: hover)").matches && !REDUCED) {
      plate.addEventListener("mouseenter", () => { timeline.classList.add("dimming"); row.classList.add("hot"); });
      plate.addEventListener("mouseleave", () => { timeline.classList.remove("dimming"); row.classList.remove("hot"); });
    }
  });
  const rail = $(".rail", timeline), run = $(".run", rail), mark = $(".mark", rail);
  const size = () => { const s = innerWidth < 1024 ? 20 : 9; mark.setAttribute("x", -s / 2); mark.setAttribute("y", -s / 2); mark.setAttribute("width", s); mark.setAttribute("height", s); };
  size(); addEventListener("resize", size);
  addScrub(rail, "top_center", "bottom_bottom", (p) => {
    const r = p * rest; run.setAttribute("height", r.toFixed(2));
    mark.setAttribute("transform", `translate(8 ${r.toFixed(2)}) rotate(${((r / rest) * 1800).toFixed(1)})`);
  }, CFG.DEFAULT);
})();

/* =====================================================================
   5 · Featured work (the paddock)
   ===================================================================== */
const paddock = $("[data-paddock]");
(() => {
  const F = CONFIG.featured, U = (n) => `calc(var(--U) * ${n})`;
  const colW = 193, colRight = `calc(2.2222cqw + ${U(12)})`, frameRight = "calc(100% - 2.2222cqw)", frameLeft = `calc(100% - 2.2222cqw - ${U(colW + 25)})`;
  const bracketSet = (l, r, t, b, cls = "") => [["tl", l, t, 270], ["tr", r, t, 0], ["br", r, b, 90], ["bl", l, b, 180]]
    .map(([c, x, y, rot]) => `<svg class="bk ${cls}" viewBox="0 0 10.5 10.5" style="left:calc(${x} - ${c.includes("r") ? U(10) : "0px"});top:calc(${y} - ${c[0] === "b" ? U(10) : "0px"});transform:rotate(${rot}deg)"><path d="M0 0.5H10V10.5"/></svg>`).join("");
  const cal = CONFIG.roadmap, CX = [[347, 100], [511, 100], [675, 100], [839, 114], [1017, 76]], LINKS = [[416, 126], [580, 128], [743, 136], [914, 124]];
  const spread = (x) => `calc(50% + ${px(x - 720)} * var(--cal-spread, 1))`;
  const liveIdx = Math.max(0, cal.findIndex((c) => c.live));
  paddock.innerHTML = `
    <canvas class="contours" aria-hidden="true"></canvas>
    <div class="band" aria-hidden="true"></div>
    <div class="feat-layer"><div class="feat">
      <div class="feat-fill">${F.img ? `<img src="${F.img}" alt="${F.name}" crossorigin="anonymous">` : `<div class="feat-art" aria-hidden="true"><div class="feat-bar"><i></i><i></i><i></i></div><b>${F.name}</b><small>${F.sub}</small></div>`}</div>
      ${plateOutline}
    </div></div>
    <div class="melt" aria-hidden="true"></div>
    <h2 class="pad-head display"><span class="head-line"><span class="hl">${F.title[0]}</span></span><span class="head-line"><span class="hl">${F.title[1]}</span><span class="stop" aria-hidden="true">.</span></span></h2>
    <div class="pad-intro"><p class="pad-report">${F.report}</p><div class="pad-cta">${slab(F.cta[0], F.cta[1], "slab", 217, 50, 8).replace("<a ", '<a target="_blank" rel="noopener" ')}</div></div>
    <div class="ppanel">
      <div class="pm-bk">${bracketSet(frameLeft, frameRight, U(32), U(105))}</div>
      <div class="pcol pmeet" style="left:calc(100% - ${colRight} - ${U(colW)});top:${U(43)}"><b>${F.meeting[0]}</b><span>${F.meeting[1]}</span><span>${F.meeting[2]}</span></div>
      <div class="ps-bk">${bracketSet(frameLeft, frameRight, U(137), U(535))}</div>
      <div class="pcol pstats" style="left:calc(100% - ${colRight} - ${U(colW)});top:${U(147)}">
        ${F.stats.map(([ic, l, v], i) => `${i ? '<div class="prule"></div>' : ""}<div class="prow">${STAT_ICONS[ic]}<span><small>${l}</small><strong>${v}</strong></span></div>`).join("")}
      </div>
    </div>
    <div class="cal">
      ${LINKS.map(([x, w], i) => `<i class="cal-link" data-dir="${i < liveIdx ? 1 : -1}" style="left:${spread(x)};width:calc(${px(w)} * var(--cal-spread, 1))"></i>`).join("")}
      ${cal.map((c, i) => { const [x, w] = CX[i]; return `<div class="cal-card${c.live ? " live" : ""}" style="left:calc(${spread(x + w / 2)} - var(--cal-card-w, ${px(w)}) / 2);width:var(--cal-card-w, ${px(w)})"><span class="r">${c.round}</span><span class="n">${c.name}</span><span class="d">${c.date}</span></div>`; }).join("")}
      ${cal.map((c, i) => { const [x, w] = CX[i]; return `<div class="cal-mark" style="left:${spread(x + w / 2)}">${c.mark ? `<b>${c.mark}</b>` : `<svg viewBox="0 0 11 11">${c.live ? `<circle class="pulse" cx="5.5" cy="5.5" r="5.5" fill="none" stroke="var(--accent)" vector-effect="non-scaling-stroke"/><circle cx="5.5" cy="5.5" r="5.5" fill="var(--accent)"/>` : `<circle cx="5.5" cy="5.5" r="5" fill="none" stroke="#fff"/>`}</svg>`}</div>`; }).join("")}
      <div class="cal-live" aria-hidden="true">${bracketSet(`calc(${spread(CX[liveIdx][0] - 6)} - var(--bracket-spread, 0px))`, `calc(${spread(CX[liveIdx][0] + CX[liveIdx][1] + 6)} + var(--bracket-spread, 0px))`, `calc(var(--u) * 32 - var(--bracket-spread, 0px))`, `calc(var(--u) * 113 + var(--bracket-spread, 0px) + var(--cal-mark-drop, 0px))`)}</div>
    </div>`;
  $(".cal-live", paddock).style.setProperty("--U", "var(--u)");
  checker(paddock, "dark", "top30");
  contourField($(".contours", paddock), rgba(PALETTE.ink, 0.08), paddock);
  addScrub(paddock, "top_bottom", "bottom_top", (p) => ($(".feat-layer", paddock).style.top = `calc(var(--u) * ${-48 * p})`));

  const heads = $$(".hl", paddock).map((el) => split(el, { stagger: 110 }));
  const stop = rise($(".pad-head .stop", paddock), { y: null, delay: 240 });
  const report = split($(".pad-report", paddock), { stagger: 30, cfg: CFG.COPY2, gap: 0.22 });
  const cta = rise($(".pad-cta", paddock), { delay: 2 * 130 + 260 });
  onceInView($(".pad-head", paddock), () => { heads.forEach((h, i) => h.play(i * 130)); stop.play(); report.play(2 * 130 + 90); cta.play(); });

  const mbk = $$(".pm-bk .bk", paddock).map((b) => rise(b, { y: null, delay: 320 })), meet = rise($(".pmeet", paddock), { delay: 410 });
  const sbk = $$(".ps-bk .bk", paddock).map((b) => rise(b, { y: null, delay: 460 }));
  const rules = $$(".prule", paddock).map((r, i) => rise(r, { axis: "x", delay: 460 + (i + 1) * 90 }));
  const rows = $$(".prow", paddock).map((r, i) => ({ row: rise(r, { delay: 460 + i * 90 + 40 }), fig: split($("strong", r), { mode: "letters", stagger: 24, cfg: CFG.FIGURE }), d: 460 + i * 90 + 120 }));
  onceInView($(".ppanel", paddock), () => { mbk.forEach((b) => b.play()); meet.play(); sbk.forEach((b) => b.play()); rules.forEach((r) => r.play()); rows.forEach((r) => { r.row.play(); r.fig.play(r.d); }); }, "0% 0% -20% 0%");

  const calEl = $(".cal", paddock);
  const links = $$(".cal-link", calEl).map((l, i) => rise(l, { axis: "x", delay: 560 + i * 90 }));

  onceInView(calEl, () => { links.forEach((l) => l.play()); cards.forEach(({ c, n }) => { c.play(); n.play(); }); marks.forEach((m) => m.play()); liveB.play(); }, "0% 0% -20% 0%");
  const liveCard = $(".cal-card.live", calEl);

  const live = tracker(paddock), linkEls = $$(".cal-link", calEl), pulse = $(".pulse", calEl);

  subscribe((t) => {
    const dt = last ? Math.min(100, t - last) : 0; last = t;
    if (!live.live() || REDUCED) return; clock += dt;
    const c = (clock % 5200) / 5200;
    linkEls.forEach((l) => (l.style.backgroundPositionX = `calc(${px(11.45)} * ${(c * l.dataset.dir).toFixed(4)})`));
    if (pulse) { const v = (clock % 3200) / 3200, e = 1 - (1 - v) * (1 - v); pulse.setAttribute("r", (5.5 + e * 5.5 * 3.4).toFixed(2)); pulse.setAttribute("opacity", (0.5 * (1 - e) ** 2).toFixed(3)); }
  });
})();

  onceInView(footer, () => { lg.play(); heads.forEach((h, i) => h.play(i * 130)); stop.play(); navs.forEach((n, i) => n.play(260 + i * 80)); foot.forEach((f) => f.play()); }, "0% 0% -25% 0%");

/* =====================================================================
   Smooth scroll + anchors
   ===================================================================== */
if (!REDUCED) {
  import("lenis").then(({ default: Lenis }) => {
    lenis = new Lenis({ smoothWheel: true });
    preFrame = (t) => lenis.raf(t);
    if (!rafId) rafId = requestAnimationFrame(loop);
  }).catch((e) => console.warn("Lenis unavailable, using native scroll.", e));
}
document.addEventListener("click", (e) => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const id = a.getAttribute("href"); if (id.length < 2) return;
  const target = $(id); if (!target) return;
  e.preventDefault();
  const top = target.closest(".layer")?.offsetTop ?? target.getBoundingClientRect().top + scrollY;
  lenis ? lenis.scrollTo(top) : scrollTo({ top, behavior: REDUCED ? "auto" : "smooth" });
});
document.addEventListener("error", (e) => { if (e.target.tagName === "IMG") reportError(e.target.src); }, true);
requestAnimationFrame(() => runScrubs(true));
</script>
</body>
</html>
